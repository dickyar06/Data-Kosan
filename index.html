<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIVA THREE-DI KOST - Dashboard</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Style terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="halaman-dashboard">
  <!-- Layar Login -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-logo">🏠</div>
      <h1 class="login-title">DIVA THREE-DI KOST</h1>
      <p class="login-sub">Silakan masuk untuk melihat dashboard</p>
      <form id="formLogin" class="login-form">
        <label>Username<input name="username" required autocomplete="username" placeholder="Masukkan username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Masukkan password"></label>
        <button type="submit" id="btnLogin">Masuk</button>
      </form>
      <div id="statusLogin"></div>
    </div>
  </div>

  <!-- Dashboard (disembunyikan sampai login berhasil) -->
  <div id="dashboard">
  <header>
    <div class="header-wrap">
      <h1>🏠 DIVA THREE-DI KOST</h1>
      <nav class="nav">
        <a class="nav-link aktif" href="index.html"> Dashboard </a>
        <a class="nav-link" href="data.html">Data</a>
        <button id="btnLogout" class="logout">Keluar</button>
      </nav>
    </div>
    <p>Dashboard Summary </p>
  </header>

  <main>
    <!-- Kartu statistik -->
    <section class="cards">
      <div class="card"><small> Total kosan </small><strong id="totalKosan">0</strong></div>
      <div class="card"><small> Total penghuni </small><strong id="total">0</strong></div>
      <div class="card"><small> Penghuni aktif </small><strong id="aktif">0</strong></div>
      <div class="card tempo-click" id="kartuTempo" title="Klik untuk melihat penghuni yang akan jatuh tempo"><small> Jatuh tempo </small><strong id="tempo">0</strong></div>
    </section>

    <!-- Ringkasan kosan -->
    <section class="kosan-card" id="ringkasanKosan"></section>

    <!-- Grafik -->
    <section class="charts">
      <div class="chart-box"><h3>📊 Penghuni per Kosan</h3><canvas id="chartKosan"></canvas></div>
      <div class="chart-box"><h3>🍩 Status Penghuni</h3><canvas id="chartStatus"></canvas></div>
      <div class="chart-box wide"><h3>📈 Penghuni Masuk per Bulan</h3><canvas id="chartBulan"></canvas></div>
    </section>
  </main>
  </div><!-- #dashboard -->

  <!-- Script terpisah -->
  <script src="script.js"></script>
</body>
</html>
